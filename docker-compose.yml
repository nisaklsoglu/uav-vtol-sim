services:
  vtol_sim:
    container_name: vtol_sim
    build:
      context: .
      dockerfile: Dockerfile
    image: uav-vtol-sim:latest
    privileged: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR:-/tmp}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/wayland-0:ro
      - ./src:/home/uav/ros2_ws/src:rw
    stdin_open: true
    tty: true
    restart: unless-stopped